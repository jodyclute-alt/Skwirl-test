<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f5f1"><link rel="manifest" href="manifest.webmanifest"><title>SKWIRL!</title><style>:root{font-family:system-ui,Arial;background:#f7f5f1;color:#26252a}*{box-sizing:border-box}body{margin:0;padding:22px;max-width:720px;margin:auto}header{display:flex;align-items:center;gap:12px;margin-bottom:25px}h1{font-size:28px;margin:0}.logo{font-size:44px}.muted{color:#777;font-size:13px}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:10px}.tile{min-height:116px;aspect-ratio:1;border:0;border-radius:20px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;font-size:16px;font-weight:700;box-shadow:0 4px 15px #00000010;position:relative;overflow:hidden}.tile .emoji{font-size:31px}.tile small{font-size:11px;font-weight:400}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:14px 0}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #8466b1}.pill{border:1px solid #ddd;background:white;padding:11px 15px;border-radius:30px;font-size:14px}.back{background:transparent;border:0;font-size:17px;padding:8px 0}input[type=text]{width:100%;border:1px solid #ddd;border-radius:12px;padding:15px;font-size:16px;background:white}.entry{display:flex;gap:8px;margin:20px 0}.entry button{border:0;border-radius:12px;background:#26252a;color:white;padding:0 18px}.item{background:white;border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px;margin:9px 0;overflow-wrap:anywhere}.item.done span{text-decoration:line-through;color:#999}.item span{flex:1}.item button{border:0;background:transparent;color:#777;font-size:21px}.empty{text-align:center;color:#888;padding:30px}dialog{border:0;border-radius:18px;padding:22px;width:min(90vw,390px);box-shadow:0 15px 70px #0004}dialog::backdrop{background:#0005}label{display:block;margin:13px 0 6px;font-size:13px}select,input[type=color]{width:100%;padding:8px}footer{font-size:12px;color:#888;text-align:center;margin-top:36px}.tilemenu{position:absolute;right:4px;top:4px;border:0;background:#ffffffb8;border-radius:9px;padding:3px 8px;font-size:19px;z-index:2}.tile{touch-action:pan-y}.tile.dragging{opacity:.45}.tile .tilelabel{padding:0 5px;overflow-wrap:anywhere}.item .itemtext{cursor:pointer}.mic{font-size:22px;min-width:49px}.menu-actions{display:flex;flex-direction:column;gap:10px}.menu-actions button{padding:13px;border:1px solid #ddd;border-radius:12px;background:white;text-align:left;font-size:16px}.danger{color:#a32525!important}.status{font-size:12px;color:#666;margin:8px 0}.tile.wide{aspect-ratio:auto}.tile.photo{background-size:cover!important;background-position:center!important}.tile.photo .tilelabel{background:#ffffffcf;border-radius:7px;padding:4px}.item input[type=checkbox]{width:22px;height:22px;flex:none}</style></head><body><header><div class="logo">🧠</div><div><h1>SKWIRL!</h1><div class="muted">Because “I’ll remember” is a lie.</div></div></header><main id="main"></main><dialog id="editDialog"><h2>Customize tile</h2><label>Tile name</label><input id="editName" type="text" maxlength="35"><label>Emoji</label><input id="editEmoji" type="text" maxlength="8"><label>Tile color</label><input id="editColor" type="color"><label>Text color</label><input id="editTextColor" type="color" value="#26252a"><label>Style</label><select id="editStyle"><option value="classic">Classic</option><option value="colorful">Colorful</option><option value="photo">Photo</option></select><label>Photo URL (optional)</label><input id="editPhoto" type="text" placeholder="https://..."><label>Font</label><select id="editFont"><option value="system-ui">Standard</option><option value="Georgia">Serif</option><option value="cursive">Cursive</option></select><label>Tile size</label><select id="editSize"><option value="1">Regular</option><option value="2">Wide (2 tiles)</option></select><label for="editChecks" style="display:flex;align-items:center;gap:12px;margin-top:20px"><input id="editChecks" type="checkbox" checked style="width:22px;height:22px;flex:none"> Show checkboxes</label><div style="font-size:13px;color:#666;margin:4px 0 18px">Checked items move to the bottom until you delete them.</div><div class="toolbar"><button class="pill" id="cancelEdit">Cancel</button><button class="pill" id="saveEdit">Save</button></div></dialog><dialog id="menuDialog"><h2 id="menuTitle">List options</h2><div class="menu-actions"><button id="renameOption">✏️ Rename list</button><button id="customizeOption">🎨 Customize tile</button><button id="shareOption">🔗 Share list</button><button id="deleteOption" class="danger">🗑 Delete list</button><button id="closeMenu">Cancel</button></div></dialog><script>const KEY='brain-v1-data';const defaults=[{id:'shopping',name:'Shopping',emoji:'🛒',color:'#e4e6fb',size:1,showCheckboxes:true,items:[]},{id:'todo',name:'To-Do',emoji:'✅',color:'#dcefe6',size:1,showCheckboxes:true,items:[]}];let lists;try{lists=JSON.parse(localStorage.getItem(KEY))||structuredClone(defaults)}catch{lists=structuredClone(defaults)}let active=null,editing=null,menuId=null;const main=document.getElementById('main');const persist=()=>localStorage.setItem(KEY,JSON.stringify(lists));function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}function render(){main.replaceChildren();if(!active){const toolbar=el('div','toolbar');toolbar.append(el('strong',null,'My lists'));const add=el('button','pill','+ New list');add.onclick=()=>{const id='list-'+Date.now();lists.push({id,name:'New list',emoji:'📝',color:'#eee5fb',size:1,showCheckboxes:true,items:[]});persist();openEdit(id)};toolbar.append(add);const backup=el('button','pill','↓ Backup');backup.onclick=backupLists;toolbar.append(backup);main.append(toolbar);const grid=el('div','tiles');lists.forEach(l=>{const wrap=el('div','tile');wrap.setAttribute('role','button');wrap.tabIndex=0;wrap.style.background=l.color;wrap.style.color=l.textColor||'#26252a';wrap.style.fontFamily=l.font||'system-ui';wrap.style.gridColumn=l.size===2?'span 2':'span 1';if(l.size===2)wrap.classList.add('wide');if(l.style==='photo'&&l.photo){wrap.classList.add('photo');wrap.style.backgroundImage='linear-gradient(#ffffff35,#ffffff35),url("'+l.photo.replace(/[^a-zA-Z0-9:/?&=._%#-]/g,'')+'")'}const emoji=el('div','emoji',l.emoji),name=el('div','tilelabel',l.name),count=el('small',null,l.items.filter(i=>!i.done).length+' remaining');wrap.append(emoji,name,count);wrap.onclick=()=>{active=l.id;render()};wrap.onkeydown=e=>{if(e.key==='Enter'){active=l.id;render()}};const menu=el('button','tilemenu','⋯');menu.setAttribute('aria-label','Options for '+l.name);menu.onclick=e=>{e.stopPropagation();openMenu(l.id)};wrap.append(menu);let timer,dragging=false,startX=0,startY=0;wrap.addEventListener('pointerdown',e=>{if(e.target===menu)return;startX=e.clientX;startY=e.clientY;dragging=false;timer=setTimeout(()=>{dragging=true;wrap.classList.add('dragging');if(navigator.vibrate)navigator.vibrate(25)},550)});wrap.addEventListener('pointermove',e=>{if(!dragging&&(Math.abs(e.clientX-startX)>12||Math.abs(e.clientY-startY)>12))clearTimeout(timer)});wrap.addEventListener('pointerup',e=>{clearTimeout(timer);if(!dragging)return;wrap.classList.remove('dragging');const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.tile');if(target&&target!==wrap){const tiles=[...grid.children];const to=tiles.indexOf(target),from=lists.findIndex(x=>x.id===l.id);if(to>=0&&from>=0){const moved=lists.splice(from,1)[0];lists.splice(to,0,moved);persist()}}dragging=false;render()});['pointercancel','pointerleave'].forEach(ev=>wrap.addEventListener(ev,()=>{clearTimeout(timer);if(ev==='pointercancel')dragging=false}));grid.append(wrap)});main.append(grid);const hint=el('p','muted','Tap a tile to open. Tap ⋯ for options. Hold and drag to rearrange.');main.append(hint)}else{const l=lists.find(x=>x.id===active);if(!l){active=null;render();return}const back=el('button','back','← All lists');back.onclick=()=>{active=null;render()};main.append(back,el('h2',null,l.emoji+' '+l.name));const entry=el('form','entry');const input=el('input');input.type='text';input.placeholder='Add an item…';input.required=true;input.setAttribute('aria-label','New list item');const mic=el('button','mic','🎙');mic.type='button';mic.setAttribute('aria-label','Speak a list item');mic.onclick=()=>startDictation(l,input);const add=el('button',null,'Add');add.type='submit';entry.append(input,mic,add);entry.onsubmit=e=>{e.preventDefault();const text=input.value.trim();if(!text)return;l.items.unshift({id:Date.now()+'-'+Math.random(),text,done:false});persist();render()};main.append(entry);if(!l.items.length)main.append(el('div','empty','Nothing here yet. Add your first item!'));(l.showCheckboxes===false?[...l.items]:[...l.items].sort((a,b)=>Number(a.done)-Number(b.done))).forEach(item=>{const row=el('div','item'+(l.showCheckboxes!==false&&item.done?' done':''));const check=el('input');check.type='checkbox';check.checked=item.done;check.setAttribute('aria-label','Complete '+item.text);check.onchange=()=>{item.done=check.checked;persist();render()};const name=el('span','itemtext',item.text);name.title='Tap to edit';name.onclick=()=>{const value=prompt('Edit item',item.text);if(value!==null&&value.trim()){item.text=value.trim();persist();render()}};const del=el('button',null,'×');del.setAttribute('aria-label','Delete '+item.text);del.onclick=()=>{if(confirm('Delete this item?')){l.items=l.items.filter(x=>x.id!==item.id);persist();render()}};if(l.showCheckboxes!==false)row.append(check);row.append(name,del);main.append(row)})}}function openEdit(id){editing=id;const l=lists.find(x=>x.id===id);document.getElementById('editName').value=l.name;document.getElementById('editTextColor').value=l.textColor||'#26252a';document.getElementById('editStyle').value=l.style||'classic';document.getElementById('editPhoto').value=l.photo||'';document.getElementById('editFont').value=l.font||'system-ui';document.getElementById('editEmoji').value=l.emoji;document.getElementById('editColor').value=l.color;document.getElementById('editSize').value=l.size;document.getElementById('editChecks').checked=l.showCheckboxes!==false;document.getElementById('editDialog').showModal();setTimeout(()=>document.getElementById('editName').select(),50)}document.getElementById('cancelEdit').onclick=()=>document.getElementById('editDialog').close();document.getElementById('saveEdit').onclick=()=>{const l=lists.find(x=>x.id===editing);l.name=document.getElementById('editName').value.trim()||l.name;l.emoji=document.getElementById('editEmoji').value.trim()||'📝';l.color=document.getElementById('editColor').value;l.textColor=document.getElementById('editTextColor').value;l.style=document.getElementById('editStyle').value;l.photo=document.getElementById('editPhoto').value.trim();l.font=document.getElementById('editFont').value;l.size=Number(document.getElementById('editSize').value);l.showCheckboxes=document.getElementById('editChecks').checked;persist();document.getElementById('editDialog').close();render()};function openMenu(id){menuId=id;const l=lists.find(x=>x.id===id);document.getElementById('menuTitle').textContent=l.name;document.getElementById('menuDialog').showModal()}function closeMenu(){document.getElementById('menuDialog').close()}document.getElementById('closeMenu').onclick=closeMenu;document.getElementById('renameOption').onclick=()=>{const id=menuId;closeMenu();openEdit(id)};document.getElementById('customizeOption').onclick=()=>{const id=menuId;closeMenu();openEdit(id)};document.getElementById('deleteOption').onclick=()=>{const id=menuId,l=lists.find(x=>x.id===id);closeMenu();if(confirm('Delete the entire "'+l.name+'" list and all its items? This cannot be undone.')){lists=lists.filter(x=>x.id!==id);persist();render()}};document.getElementById('shareOption').onclick=()=>{closeMenu();alert('Live shared lists require an online sync service. This version keeps your lists private on this phone; sharing will be enabled after cloud setup.')};function backupLists(){const blob=new Blob([JSON.stringify({version:1,lists,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='skwirl-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}function startDictation(list,input){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Speech recognition is not supported in this browser. You can use the microphone on your Samsung keyboard instead.');input.focus();return}const recognition=new SR();recognition.lang=navigator.language||'en-US';recognition.interimResults=false;recognition.maxAlternatives=1;recognition.onresult=e=>{const spoken=e.results[0][0].transcript.trim();if(spoken){list.items.unshift({id:Date.now()+'-'+Math.random(),text:spoken,done:false});persist();render()}};recognition.onerror=e=>{if(e.error!=='no-speech'&&e.error!=='aborted')alert('Microphone unavailable: '+e.error)};recognition.start()}render();</script><footer>SKWIRL v1.2 • Lists are saved on this device. Back up regularly.</footer></body></html>
